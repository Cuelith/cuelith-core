packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

# Nessuna dipendenza esegue script di installazione. Electron 44 scarica il
# suo eseguibile al primo avvio (o con `node node_modules/electron/install.js`).

minimumReleaseAgeExclude:
  - "@types/ws@8.18.2"
  - electron@44.5.0

# electron-winstaller arriva con electron-builder ma serve solo per un formato
# di installatore che non usiamo (Squirrel): il suo script resta spento.
allowBuilds:
  electron-winstaller: false
