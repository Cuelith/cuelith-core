name: Release

# Un tag vX.Y.Z (solo su main) crea gli installatori e li pubblica nella
# release di GitHub del nucleo: da li' l'app installata scarica gli
# aggiornamenti (decisione 0004). Windows senza firma (avviso SmartScreen),
# macOS rimandato.
#
# La release nasce in bozza, con le note di versioni/X.Y.Z.md (italiano, una
# riga ---, inglese), e diventa pubblica solo quando tutti gli installatori
# sono stati caricati: una versione non resta mai visibile a meta'.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Versione uguale al tag, con le sue note
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME"
          test -s "versioni/$version.md"
      - name: Bozza della release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "Cuelith $version" --notes-file "versioni/$version.md"

  installers:
    needs: draft
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: cuelith-core
      # Le release si costruiscono con SDK e lingue pubblicati (main).
      - uses: actions/checkout@v7
        with:
          repository: Cuelith/cuelith-sdk
          ref: main
          path: cuelith-sdk
      - uses: actions/checkout@v7
        with:
          repository: Cuelith/plugin-locale-it
          ref: main
          path: plugin-locale-it
      - uses: actions/checkout@v7
        with:
          repository: Cuelith/plugin-locale-en
          ref: main
          path: plugin-locale-en
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: cuelith-core/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: SDK
        working-directory: cuelith-sdk
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Build e controlli
        working-directory: cuelith-core
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm check
      - name: Installatori
        working-directory: cuelith-core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm -C apps/desktop run pack:app
          pnpm -C apps/desktop exec electron-builder --publish always

  # Il programma che gli autori di plugin usano per provare il proprio pacchetto.
  conformance:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: cuelith-core
      - uses: actions/checkout@v7
        with:
          repository: Cuelith/cuelith-sdk
          ref: main
          path: cuelith-sdk
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: cuelith-core/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: SDK
        working-directory: cuelith-sdk
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Programma di verifica
        working-directory: cuelith-core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@cuelith-core/conformance..." build
          pnpm -C apps/conformance bundle
          gh release upload "$GITHUB_REF_NAME" apps/conformance/bundle/cuelith-conformance.mjs --clobber

  publish:
    needs: [installers, conformance]
    runs-on: ubuntu-latest
    steps:
      - name: La release diventa pubblica
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
