name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # I repo vanno affiancati come in locale: cuelith-core usa cuelith-sdk
      # con link:../../../cuelith-sdk e legge la lingua da ../plugin-locale-it.
      - uses: actions/checkout@v7
        with:
          path: cuelith-core
      - uses: actions/checkout@v7
        with:
          repository: Cuelith/cuelith-sdk
          ref: ${{ github.base_ref || github.ref_name }}
          path: cuelith-sdk
      - uses: actions/checkout@v7
        with:
          repository: Cuelith/plugin-locale-it
          ref: ${{ github.base_ref || github.ref_name }}
          path: plugin-locale-it
      # Il modulo Canti vero, per la prova con l'app (e2e/tests/songs.spec.ts).
      # Ramo dev finche' il modulo non ha la prima release su main.
      - uses: actions/checkout@v7
        with:
          repository: Cuelith/plugin-songs
          ref: dev
          path: plugin-songs
      # Il modulo d'esempio hello-panel, per la prova dei processi dei moduli
      # (e2e/tests/processes.spec.ts).
      - uses: actions/checkout@v7
        with:
          repository: Cuelith/plugin-template
          ref: dev
          path: plugin-template
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: cuelith-core/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: SDK
        working-directory: cuelith-sdk
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Modulo Canti
        working-directory: plugin-songs
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Modulo d'esempio
        working-directory: plugin-template
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Installazione
        working-directory: cuelith-core
        run: pnpm install --frozen-lockfile
      - name: Formattazione
        working-directory: cuelith-core
        run: pnpm exec prettier --check .
      - name: Build
        working-directory: cuelith-core
        run: pnpm build
      - name: Typecheck, lint, test
        working-directory: cuelith-core
        run: pnpm check

      - name: Prove con l'app vera (Electron)
        working-directory: cuelith-core
        run: |
          # Ubuntu 24.04 limita i namespace richiesti dalla sandbox di Chromium.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node apps/desktop/node_modules/electron/install.js
          xvfb-run -a pnpm -C e2e e2e
      - name: App impacchettata (come l'installatore) e prove principali
        working-directory: cuelith-core
        run: |
          pnpm -C apps/desktop run dist:dir
          CUELITH_E2E_EXECUTABLE="$PWD/apps/desktop/pack/release/linux-unpacked/cuelith"             xvfb-run -a pnpm -C e2e exec playwright test station processes network
      - name: Screenshot delle prove
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: |
            cuelith-core/e2e/screenshots
            cuelith-core/e2e/test-results
          if-no-files-found: ignore
