# Installatori di Cuelith (cap. 20, decisione 0004). L'app e' la cartella
# pack/app preparata da scripts/stage.mjs: niente node_modules, niente
# dipendenze da installare.
appId: io.github.cuelith.app
productName: Cuelith
copyright: Copyright © Cuelith contributors
electronVersion: 44.5.0
npmRebuild: false
asar: true
directories:
  app: pack/app
  output: pack/release
  buildResources: build
extraResources:
  - from: pack/plugins
    to: plugins
  # La GPL vuole il testo della licenza insieme al programma.
  - from: ../../LICENSE
    to: legal/LICENSE
  - from: ../../NOTICE
    to: legal/NOTICE
  - from: ../../PLUGIN-EXCEPTION.md
    to: legal/PLUGIN-EXCEPTION.md
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  # Installazione per l'utente (niente amministratore), cartella a scelta.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Cuelith-Setup-${version}.${ext}
  shortcutName: Cuelith
  # Lingua dell'installatore a scelta all'inizio (italiano o inglese); l'app parte nella stessa
  # (build/installer.nsh scrive install-lang.txt). Se Cuelith e' gia' installato, lo dice.
  multiLanguageInstaller: true
  installerLanguages: [it_IT, en_US]
  displayLanguageSelector: true
  include: build/installer.nsh
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: AudioVideo
  icon: build/icon.png
  artifactName: Cuelith-${version}-${arch}.${ext}
# Le release e gli aggiornamenti arrivano da GitHub Releases del nucleo.
publish:
  provider: github
  owner: Cuelith
  repo: cuelith-core
  releaseType: draft
