<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>Bibbia</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#14171f; --panel-2:#1b1f2a; --border:#272c39;
    --fg:#e7e9ee; --fg-dim:#8b93a7; --fg-faint:#565d70;
    --accent:#e8a33d; --accent-ink:#1a1305; --accent-dim:#3a2f1a;
    --ok:#5fc98d;
    /* Solo font di sistema: un plugin non deve dipendere dalla rete per
       renderizzarsi, tantomeno durante uno show live. */
    --font-display:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:var(--font-body); font-size:14px;
    display:flex; flex-direction:column;
  }
  .shell{display:flex;flex-direction:column;height:100%;padding:1.1rem 1.3rem;gap:0.9rem}

  header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:0.4rem}
  h1{font-family:var(--font-display);font-weight:700;font-size:1.3rem;margin:0;letter-spacing:0.01em}
  .subtitle{color:var(--fg-faint);font-size:0.78rem}

  .toolbar{display:flex;align-items:center;gap:0.6rem}
  .modes{display:flex;gap:0.25rem;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:0.2rem}
  .modes button{
    background:transparent;border:none;color:var(--fg-dim);font-family:var(--font-display);
    font-weight:600;letter-spacing:0.02em;font-size:0.82rem;padding:0.4rem 0.85rem;border-radius:6px;cursor:pointer;
  }
  .modes button.active{background:var(--accent);color:var(--accent-ink)}

  select,input[type=text]{
    background:var(--panel-2);border:1px solid var(--border);border-radius:7px;color:var(--fg);
    padding:0.5rem 0.7rem;font-size:0.86rem;font-family:var(--font-body);
  }
  select:focus,input:focus{outline:1px solid var(--accent);outline-offset:-1px}

  .picker{display:flex;gap:0.6rem;flex-wrap:wrap}
  .picker select{min-width:8rem}
  #search-input{width:100%}

  .hint{font-size:0.74rem;color:var(--fg-faint);margin:0}

  main{flex:1;min-height:0;display:flex;flex-direction:column;gap:0.6rem}
  .list{
    flex:1; min-height:0; overflow-y:auto;
    display:flex;flex-direction:column;gap:0.15rem;
    border:1px solid var(--border);border-radius:10px;padding:0.5rem;background:#000;
  }
  .row{
    display:grid;grid-template-columns:1.5rem 2.2rem 1fr;gap:0.6rem;align-items:start;
    padding:0.5rem 0.6rem;border-radius:7px;cursor:pointer;user-select:none;
  }
  .row:hover{background:var(--panel-2)}
  .row.selected{background:var(--accent-dim)}
  .row input{margin-top:0.25rem;accent-color:var(--accent)}
  .vnum{font-family:var(--font-mono);color:var(--fg-faint);font-size:0.78rem;padding-top:0.05rem}
  .vtext{font-size:0.88rem;line-height:1.5}
  .empty{color:var(--fg-faint);font-size:0.85rem;padding:1.2rem;text-align:center}

  .tray{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:0.8rem 0.9rem;display:flex;flex-direction:column;gap:0.7rem;
  }
  .chips{display:flex;flex-wrap:wrap;gap:0.4rem;min-height:1.6rem}
  .chip{
    display:flex;align-items:center;gap:0.4rem;background:var(--accent-dim);color:var(--accent);
    border:1px solid var(--accent);border-radius:20px;padding:0.22rem 0.4rem 0.22rem 0.75rem;
    font-size:0.78rem;font-family:var(--font-mono);
  }
  .chip button{background:transparent;border:none;color:inherit;padding:0 0.15rem;cursor:pointer;font-size:0.8rem;line-height:1}
  .chips-empty{color:var(--fg-faint);font-size:0.8rem;padding-top:0.15rem}

  .tray-bottom{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:0.9rem}
  .options{display:flex;flex-direction:column;gap:0.4rem}
  .options-label{font-family:var(--font-display);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--fg-faint)}
  .options label{display:flex;align-items:center;gap:0.45rem;font-size:0.84rem;color:var(--fg-dim);cursor:pointer}
  .options input{accent-color:var(--accent)}

  button.primary{
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;
    font-family:var(--font-display);font-weight:700;letter-spacing:0.02em;
    padding:0.6rem 1.2rem;cursor:pointer;font-size:0.95rem;white-space:nowrap;
  }
  button.primary:hover:not(:disabled){filter:brightness(1.08)}
  button.primary:disabled{opacity:0.4;cursor:not-allowed}

  .status{font-size:0.8rem;color:var(--fg-faint);min-height:1.1em}
  .status.ok{color:var(--ok)}
  .status.err{color:#ff8f87}
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>Bibbia</h1>
    <span class="subtitle">traduzione di esempio · Giovanni 3 popolato per intero</span>
  </header>

  <div class="toolbar">
    <div class="modes">
      <button class="active" data-mode="browse" id="mode-browse">Sfoglia</button>
      <button data-mode="search" id="mode-search">Ricerca rapida</button>
    </div>
  </div>

  <main>
    <div id="browse" style="display:flex;flex-direction:column;gap:0.6rem;min-height:0;flex:1">
      <div class="picker">
        <select id="book"></select>
        <select id="chapter"></select>
      </div>
      <p class="hint">Click per un versetto, Shift+click per selezionare un intervallo intero.</p>
      <div class="list" id="verse-list"></div>
    </div>

    <div id="search" style="display:none;flex-direction:column;gap:0.6rem;min-height:0;flex:1">
      <input type="text" id="search-input" placeholder='&quot;Giovanni 3:16&quot; oppure una parola come &quot;amato&quot;' />
      <div class="list" id="search-results"></div>
    </div>
  </main>

  <div class="tray">
    <div class="chips" id="chips"></div>
    <div class="tray-bottom">
      <div class="options">
        <span class="options-label">Come li aggiungo</span>
        <label><input type="radio" name="split" value="one" checked /> Tutti i versetti in un'unica diapositiva</label>
        <label><input type="radio" name="split" value="each" /> Una diapositiva per versetto</label>
        <label><input type="checkbox" id="show-ref" checked /> Includi il riferimento nel testo</label>
      </div>
      <button class="primary" id="add-btn" disabled>Seleziona almeno un versetto</button>
    </div>
    <p class="status" id="status"></p>
  </div>
</div>

<script>
(function () {
  // ---- bridge verso il core (vedi src/lib/plugin-bridge.ts) ----
  var pending = {};
  var reqId = 0;
  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || !pending[data.id]) return;
    var entry = pending[data.id];
    delete pending[data.id];
    if (data.ok) entry.resolve(data.result); else entry.reject(new Error(data.error));
  });
  function callHost(type, payload) {
    return new Promise(function (resolve, reject) {
      var id = 'r' + (reqId++);
      pending[id] = { resolve: resolve, reject: reject };
      window.parent.postMessage({ id: id, type: type, payload: payload }, '*');
    });
  }

  // ---- dati di esempio (poche decine di versetti, non l'intera Bibbia:
  // il catalogo di traduzioni scaricabili e' una fase successiva) ----
  var BOOKS = ['Genesi', 'Salmi', 'Matteo', 'Giovanni', 'Romani'];
  var CHAPTER_COUNTS = { Genesi: 50, Salmi: 150, Matteo: 28, Giovanni: 21, Romani: 16 };
  var CHAPTER_VERSE_COUNTS = { 'Giovanni-3': 21 };
  var VERSE_TEXT = {
    'Giovanni-3': {
      1: 'Or v’era tra i Farisei un uomo di nome Nicodemo, un capo dei Giudei.',
      2: 'Egli venne da Gesù, di notte, e gli disse: Maestro, sappiamo che sei un dottore venuto da Dio.',
      3: 'Gesù rispose: In verità, in verità ti dico che se uno non nasce di nuovo, non può vedere il regno di Dio.',
      4: 'Nicodemo gli disse: Come può un uomo nascere quando è vecchio? Può egli entrare una seconda volta nel seno di sua madre e nascere?',
      5: 'Gesù rispose: In verità, in verità ti dico che se uno non nasce d’acqua e di Spirito, non può entrare nel regno di Dio.',
      14: 'E come Mosè innalzò il serpente nel deserto, così bisogna che il Figlio dell’uomo sia innalzato,',
      15: 'affinché chiunque crede in lui abbia vita eterna.',
      16: 'Poiché Iddio ha tanto amato il mondo, che ha dato il suo unigenito Figliuolo, affinché chiunque crede in lui non perisca, ma abbia vita eterna.',
      17: 'Iddio non ha mandato il Figlio nel mondo per giudicare il mondo, ma perché il mondo sia salvato per mezzo di lui.',
      18: 'Chi crede in lui non è giudicato; chi non crede è già giudicato, perché non ha creduto nel nome dell’unigenito Figliuol di Dio.'
    }
  };
  function verseText(book, chapter, verse) {
    var key = book + '-' + chapter;
    if (VERSE_TEXT[key] && VERSE_TEXT[key][verse]) return VERSE_TEXT[key][verse];
    return 'Testo di esempio per ' + book + ' ' + chapter + ':' + verse + '.';
  }
  function versesInChapter(book, chapter) {
    return CHAPTER_VERSE_COUNTS[book + '-' + chapter] || 20;
  }

  // ---- stato ----
  var mode = 'browse';
  var selected = []; // { book, chapter, verse }
  var anchor = null; // { container, index }

  function key(s) { return s.book + '|' + s.chapter + '|' + s.verse; }
  function isSelected(book, chapter, verse) {
    var k = book + '|' + chapter + '|' + verse;
    return selected.some(function (s) { return key(s) === k; });
  }
  function toggle(book, chapter, verse) {
    var k = book + '|' + chapter + '|' + verse;
    var idx = selected.findIndex(function (s) { return key(s) === k; });
    if (idx >= 0) selected.splice(idx, 1);
    else selected.push({ book: book, chapter: chapter, verse: verse });
  }

  function rowHtml(book, chapter, verse) {
    var sel = isSelected(book, chapter, verse);
    return '<div class="row' + (sel ? ' selected' : '') + '" data-book="' + book + '" data-chapter="' + chapter + '" data-verse="' + verse + '">' +
      '<input type="checkbox" ' + (sel ? 'checked' : '') + ' tabindex="-1" />' +
      '<span class="vnum">' + verse + '</span>' +
      '<span class="vtext">' + verseText(book, chapter, verse) + '</span>' +
    '</div>';
  }

  function wireRows(container) {
    var rows = container.querySelectorAll('.row');
    rows.forEach(function (row, idx) {
      row.addEventListener('click', function (e) {
        e.preventDefault();
        var book = row.dataset.book, chapter = Number(row.dataset.chapter), verse = Number(row.dataset.verse);
        if (e.shiftKey && anchor && anchor.container === container) {
          var lo = Math.min(anchor.index, idx), hi = Math.max(anchor.index, idx);
          for (var i = lo; i <= hi; i++) {
            var r = rows[i];
            var b = r.dataset.book, c = Number(r.dataset.chapter), v = Number(r.dataset.verse);
            if (!isSelected(b, c, v)) selected.push({ book: b, chapter: c, verse: v });
          }
        } else {
          toggle(book, chapter, verse);
          anchor = { container: container, index: idx };
        }
        renderCurrentList();
        renderTray();
      });
    });
  }

  function renderPickers() {
    var bookEl = document.getElementById('book');
    if (!bookEl.options.length) {
      bookEl.innerHTML = BOOKS.map(function (b) { return '<option' + (b === 'Giovanni' ? ' selected' : '') + '>' + b + '</option>'; }).join('');
    }
    var chapterEl = document.getElementById('chapter');
    var book = bookEl.value;
    var maxCh = CHAPTER_COUNTS[book] || 10;
    var wantedCh = (book === 'Giovanni' && !chapterEl.value) ? 3 : Math.min(Number(chapterEl.value) || 1, maxCh);
    var html = '';
    for (var c = 1; c <= maxCh; c++) html += '<option value="' + c + '"' + (c === wantedCh ? ' selected' : '') + '>' + c + '</option>';
    chapterEl.innerHTML = html;
  }

  function renderVerseList() {
    var book = document.getElementById('book').value;
    var chapter = Number(document.getElementById('chapter').value);
    var count = versesInChapter(book, chapter);
    var list = document.getElementById('verse-list');
    var html = '';
    for (var v = 1; v <= count; v++) html += rowHtml(book, chapter, v);
    list.innerHTML = html;
    wireRows(list);
  }

  function renderSearchResults() {
    var query = document.getElementById('search-input').value.trim();
    var results = document.getElementById('search-results');
    if (!query) {
      results.innerHTML = '<p class="empty">Scrivi un riferimento o una parola.</p>';
      return;
    }
    var refMatch = query.match(/^([a-zA-ZÀ-ÿ]+)\s+(\d+)\s*:\s*(\d+)(?:\s*-\s*(\d+))?$/);
    var rows = [];
    if (refMatch) {
      var book = BOOKS.filter(function (b) { return b.toLowerCase() === refMatch[1].toLowerCase(); })[0];
      if (book) {
        var chapter = Number(refMatch[2]), from = Number(refMatch[3]), to = refMatch[4] ? Number(refMatch[4]) : from;
        for (var v = from; v <= to; v++) rows.push({ book: book, chapter: chapter, verse: v });
      }
    }
    if (rows.length === 0) {
      var q = query.toLowerCase();
      Object.keys(VERSE_TEXT).forEach(function (k) {
        var parts = k.split('-');
        Object.keys(VERSE_TEXT[k]).forEach(function (v) {
          if (VERSE_TEXT[k][v].toLowerCase().indexOf(q) !== -1) {
            rows.push({ book: parts[0], chapter: Number(parts[1]), verse: Number(v) });
          }
        });
      });
    }
    results.innerHTML = rows.length
      ? rows.map(function (r) { return rowHtml(r.book, r.chapter, r.verse); }).join('')
      : '<p class="empty">Nessun risultato. Prova "Giovanni 3:16" o "amato".</p>';
    wireRows(results);
  }

  function renderCurrentList() {
    if (mode === 'browse') renderVerseList(); else renderSearchResults();
  }

  function renderTray() {
    var chips = document.getElementById('chips');
    chips.innerHTML = selected.length
      ? selected.map(function (s, i) {
          return '<span class="chip">' + s.book + ' ' + s.chapter + ':' + s.verse + '<button data-i="' + i + '">✕</button></span>';
        }).join('')
      : '<span class="chips-empty">Nessun versetto selezionato.</span>';
    chips.querySelectorAll('button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var s = selected[Number(btn.dataset.i)];
        toggle(s.book, s.chapter, s.verse);
        renderCurrentList();
        renderTray();
      });
    });

    var addBtn = document.getElementById('add-btn');
    var split = document.querySelector('input[name="split"]:checked').value;
    if (selected.length === 0) {
      addBtn.textContent = 'Seleziona almeno un versetto';
      addBtn.disabled = true;
    } else {
      addBtn.disabled = false;
      addBtn.textContent = (split === 'each' && selected.length > 1)
        ? 'Aggiungi ' + selected.length + ' diapositive alla scaletta'
        : 'Aggiungi alla scaletta';
    }
  }

  document.getElementById('mode-browse').addEventListener('click', function () {
    mode = 'browse';
    this.classList.add('active');
    document.getElementById('mode-search').classList.remove('active');
    document.getElementById('browse').style.display = 'flex';
    document.getElementById('search').style.display = 'none';
  });
  document.getElementById('mode-search').addEventListener('click', function () {
    mode = 'search';
    this.classList.add('active');
    document.getElementById('mode-browse').classList.remove('active');
    document.getElementById('search').style.display = 'flex';
    document.getElementById('browse').style.display = 'none';
    renderSearchResults();
  });
  document.getElementById('book').addEventListener('change', function () { renderPickers(); renderVerseList(); });
  document.getElementById('chapter').addEventListener('change', renderVerseList);
  document.getElementById('search-input').addEventListener('input', renderSearchResults);
  document.querySelectorAll('input[name="split"]').forEach(function (r) { r.addEventListener('change', renderTray); });

  document.getElementById('add-btn').addEventListener('click', function () {
    var btn = this;
    var status = document.getElementById('status');
    var split = document.querySelector('input[name="split"]:checked').value;
    var showRef = document.getElementById('show-ref').checked;
    btn.disabled = true;
    status.textContent = 'Aggiungo alla scaletta…';
    status.className = 'status';

    var work;
    if (split === 'each') {
      work = selected.reduce(function (chain, s) {
        return chain.then(function () {
          var ref = s.book + ' ' + s.chapter + ':' + s.verse;
          var text = verseText(s.book, s.chapter, s.verse);
          return callHost('add-cue', {
            kind: 'core.slide',
            title: ref,
            payload: { text: showRef ? ref + '\n\n' + text : text }
          });
        });
      }, Promise.resolve());
    } else {
      var ordered = selected.slice();
      var ref = ordered.length === 1
        ? ordered[0].book + ' ' + ordered[0].chapter + ':' + ordered[0].verse
        : ordered[0].book + ' ' + ordered[0].chapter + ' (' + ordered.length + ' versetti)';
      var text = ordered.map(function (s) { return verseText(s.book, s.chapter, s.verse); }).join(' ');
      work = callHost('add-cue', {
        kind: 'core.slide',
        title: ref,
        payload: { text: showRef ? ref + '\n\n' + text : text }
      });
    }

    work.then(function () {
      status.textContent = 'Aggiunto alla scaletta ✓ — torno alla console…';
      status.className = 'status ok';
      selected = [];
      anchor = null;
      renderCurrentList();
      renderTray();
    }).catch(function (err) {
      status.textContent = 'Errore: ' + err.message;
      status.className = 'status err';
      btn.disabled = false;
    });
  });

  renderPickers();
  renderVerseList();
  renderTray();
})();
</script>
</body>
</html>
